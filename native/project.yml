name: Portfolio
options:
  bundleIdPrefix: de.portfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # HARD RULE: the native shell and the web app are ONE app on two platforms and
    # must always report the same version. The shell loads the live GitHub Pages
    # build, so the content is already identical by construction — this keeps the
    # number the user sees in Settings honest too. scripts/sync-version.sh reads it
    # from index.html so the two cannot drift.
    MARKETING_VERSION: "2.6.154"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Portfolio:
    type: application
    platform: iOS
    sources:
      - path: Portfolio
    info:
      path: Portfolio/Info.plist
      properties:
        # Renamed from "Portfolio" so it is distinguishable from the PWA, which
        # keeps that name. Both were identical in Spotlight and on the home
        # screen, which made it impossible to tell which one was being opened.
        # Bundle id deliberately unchanged: this UPDATES the installed app rather
        # than adding a third icon.
        CFBundleDisplayName: Basis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSFaceIDUsageDescription: >-
          Basis uses Face ID to unlock your encrypted portfolio, so you do not have
          to type your passcode every time you open it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.portfolio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
